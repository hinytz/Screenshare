<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Screenshare</title>
    <link rel="icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="login" class="view">
      <div class="home">
        <div class="lang-toggle" role="group" aria-label="Language" data-i18n-aria="language">
          <button type="button" id="lang-en" data-lang="en">EN</button>
          <button type="button" id="lang-pt" data-lang="pt">PT</button>
        </div>
        <form id="login-form" class="login-card" autocomplete="off">
          <img class="home-logo" src="/screenshare-logo.png" alt="Screenshare" />
          <a
            class="home-github"
            href="https://github.com/hinytz/Screenshare"
            target="_blank"
            rel="noreferrer"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.26c0 4.52 2.87 8.36 6.84 9.72.5.1.68-.22.68-.49 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.36 1.12 2.94.85.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.3.1-2.7 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 6.84c.85 0 1.71.12 2.51.35 1.9-1.32 2.74-1.05 2.74-1.05.55 1.4.2 2.44.1 2.7.64.72 1.03 1.64 1.03 2.76 0 3.94-2.34 4.8-4.57 5.06.36.32.68.95.68 1.92 0 1.38-.01 2.5-.01 2.84 0 .27.18.6.69.49A10.04 10.04 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z"/>
            </svg>
            <span>github.com/hinytz/Screenshare</span>
          </a>
          <a
            class="home-download"
            href="https://github.com/hinytz/Screenshare/releases/latest"
            target="_blank"
            rel="noreferrer"
            data-i18n="download_windows"
          >Download Windows app</a>
          <div class="mode-toggle" role="tablist" aria-label="Room action" data-i18n-aria="room_action">
            <button type="button" id="mode-join" role="tab" aria-selected="true" data-i18n="join">Join</button>
            <button type="button" id="mode-create" role="tab" aria-selected="false" data-i18n="create">Create</button>
          </div>
          <div id="home-step-room">
            <label class="field">
              <span data-i18n="room">Room</span>
              <input
                id="room-name"
                name="room"
                type="text"
                required
                minlength="2"
                maxlength="37"
                autocomplete="off"
                autofocus
                placeholder="room#abcd"
                data-i18n-placeholder="room_placeholder"
              />
            </label>
            <label class="field">
              <span data-i18n="password">Password</span>
              <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="current-password"
              />
            </label>
            <p id="create-ttl-warn" class="home-warn" hidden data-i18n="create_ttl">
              Rooms are deleted 5 days after the last login.
            </p>
          </div>
          <div id="home-step-user" hidden>
            <p id="home-room-heading" class="home-room-heading"></p>
            <label class="field">
              <span data-i18n="username">Username</span>
              <input
                id="username"
                name="username"
                type="text"
                minlength="2"
                maxlength="32"
                autocomplete="nickname"
              />
            </label>
            <button type="button" id="home-back" class="home-back" data-i18n="back">Back</button>
          </div>
          <button type="submit" id="login-btn" data-i18n="continue">Enter</button>
          <p id="login-error" class="error" hidden></p>
        </form>
      </div>
    </div>

    <div id="room" class="view" hidden>
      <div class="room-shell">
      <main class="stage">
        <section class="pane" id="pane-you" data-live="false" data-slot="pip">
          <header class="pane-meta">
            <span class="pane-name" id="you-name">You</span>
            <span class="tally" aria-hidden="true"></span>
            <span class="pane-state">Idle</span>
          </header>
          <video id="local-video" autoplay playsinline muted></video>
          <div class="pane-empty">
            <img src="/bearzzz.png" alt="" />
            <span data-i18n="not_sharing">Not sharing</span>
          </div>
          <div class="pane-controls">
            <button class="pane-pip" type="button" aria-label="Picture-in-picture" title="Picture-in-picture" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 7H5c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm0 8H5V9h14v6z"/>
                <path d="M13 10h5v3.8h-5z"/>
              </svg>
            </button>
          </div>
        </section>
        <div id="pip-rail" class="pip-rail"></div>
        <video id="cam-feature" class="cam-feature" autoplay playsinline muted hidden></video>
        <div id="cam-stack" class="cam-stack"></div>
      </main>
      <footer class="bar">
        <div class="people-wrap">
          <button id="peer-status" type="button" class="status bar-tip" aria-label="People" data-i18n-aria="people" aria-expanded="false" aria-controls="people-panel">

            <span id="peer-count">1 / 5</span>
          </button>
          <div id="people-panel" class="people-panel" hidden>
            <p class="people-heading" data-i18n="people">People</p>
            <ul id="people-list"></ul>
          </div>
        </div>
        <div class="mic-wrap">
          <button id="mic-btn" type="button" class="bar-tip" aria-label="Microphone" data-i18n-aria="microphone" aria-expanded="false" aria-controls="mic-panel" data-live="false" data-muted="true">

            <button id="mic-toggle" type="button" data-i18n="unmute">Unmute</button>
            <label class="field">
              <span data-i18n="microphone">Microphone</span>
              <select id="mic-device"></select>
            </label>
            <label class="field">
              <span data-i18n="input_volume">Input volume</span>
              <input id="mic-gain" type="range" min="0" max="200" value="100" />
            </label>
            <label class="field">
              <span data-i18n="voice_activity">Voice activity</span>
              <div class="vad-meter">
                <span id="mic-level" class="vad-level"></span>
                <input id="mic-vad" type="range" min="0" max="100" value="4" />
              </div>
            </label>
          </div>
        </div>
        <button

          id="room-label"
          class="room-label bar-tip"
          hidden
          aria-label="Copy room link"

      </div>
      <div id="chat-overlay" class="chat-overlay" hidden>
        <aside id="chat-drawer" class="chat-drawer" aria-labelledby="chat-title">
          <header class="chat-head">
            <p id="chat-title" data-i18n="chat">Chat</p>
            <button id="chat-close" type="button" aria-label="Close" data-i18n-aria="close">&times;</button>
          </header>
          <div id="chat-log" class="chat-log"></div>
          <form id="chat-form" class="chat-form">
            <textarea
              id="chat-input"
              rows="1"
              maxlength="500"
              autocomplete="off"
              placeholder="Send a message"
              data-i18n-placeholder="chat_placeholder"
            ></textarea>
            <button type="submit" data-i18n="send">Send</button>
          </form>
        </aside>
      </div>
      <div id="picker" class="picker" hidden>
        <div class="picker-card">
          <header class="picker-head">
            <p class="wordmark" id="picker-title" data-i18n="share">Share</p>
            <button id="picker-cancel" type="button" data-i18n="cancel">Cancel</button>
          </header>
          <div id="quality-row" class="quality-row" role="group" aria-label="Stream quality" data-i18n-aria="stream_quality"></div>
          <div id="picker-tabs" class="picker-tabs" hidden role="tablist" aria-label="Share source" data-i18n-aria="share_source">
            <button id="picker-tab-windows" type="button" role="tab" aria-selected="true" data-i18n="windows">Windows</button>
            <button id="picker-tab-browsers" type="button" role="tab" aria-selected="false" data-i18n="browsers">Browsers</button>
          </div>
          <video id="camera-preview" class="camera-preview" autoplay playsinline muted hidden></video>
          <div id="picker-grid" class="picker-grid"></div>
          <p id="picker-empty" class="picker-empty" hidden></p>
          <button id="picker-continue" class="picker-continue" type="button" hidden data-i18n="continue">Continue</button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
