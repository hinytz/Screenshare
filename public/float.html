<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Cameras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #eeeeee;
        font-family: "Poppins", "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      .float-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        height: 2rem;
        padding: 0 0.65rem;
        border-bottom: 1px solid #1c1c1c;
        -webkit-app-region: drag;
        user-select: none;
      }

      .float-head span {
        font-size: 0.62rem;
        text-transform: uppercase;
        color: #7a7a7a;
      }

      .float-actions {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        -webkit-app-region: no-drag;
      }

      .float-head button {
        -webkit-app-region: no-drag;
        font: inherit;
        font-size: 0.62rem;
        text-transform: uppercase;
        color: #eeeeee;
        background: #0a0a0a;
        border: none;
        border-radius: 7px;
        padding: 0.2rem 0.45rem;
        cursor: pointer;
      }

      .float-head button:hover {
        background: #141414;
      }

      .float-head button[aria-pressed="true"] {
        color: #6b9fff;
        background: #141c28;
      }

      #cams {
        flex: 1;
        display: flex;
        align-items: stretch;
        min-height: 0;
        background: #000;
      }

      #cams:empty {
        display: none;
      }

      #cams video {
        flex: 1;
        min-width: 0;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      #empty {
        flex: 1;
        display: grid;
        place-items: center;
        margin: 0;
        font-size: 0.68rem;
        text-transform: uppercase;
        color: #7a7a7a;
      }

      #empty[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <header class="float-head">
      <span>Cameras</span>
      <div class="float-actions">
        <button id="self-toggle" type="button" hidden>Show my camera</button>
        <button id="close" type="button">Close</button>
      </div>
    </header>
    <div id="cams"></div>
    <p id="empty">No cameras</p>
    <script>
      document.getElementById('close').addEventListener('click', () => {
        window.close();
      });
      document.getElementById('self-toggle').addEventListener('click', () => {
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'float-toggle-self-cam' }, location.origin);
          }
        } catch {
          // opener gone
        }
      });
      function notifyOpener() {
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: 'float-ready' }, location.origin);
          }
        } catch {
          // opener gone
        }
      }
      notifyOpener();
      window.addEventListener('load', notifyOpener);
    </script>
  </body>
</html>
